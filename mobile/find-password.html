<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>MACHINE IQ 비밀번호 찾기</title>
  <link rel="icon" href="./assets/favicon.ico">
  <link rel="stylesheet" href="./assets/local-fonts.css">
  <link rel="stylesheet" href="./shared/mobile-guide-tokens.css?v=20260904-3">
  <link rel="stylesheet" href="./shared/mobile-preauth-header.css?v=20260905-1">
  <link rel="stylesheet" href="./shared/login.css?v=20260905-5">
  <link rel="stylesheet" href="./shared/find-password.css?v=20260905-3">
  <link rel="stylesheet" href="./shared/mobile-type-compact.css?v=20260907-1">
  <link rel="stylesheet" href="./web-guide-colors.css?v=20260913-r62">
</head>
<body data-screen-id="LQ-AUTH-004" class="mobile-type-compact mobile-tone-c" data-mobile-home="./index.html" data-mobile-login="./login.html">
  <main class="login-page recovery-page">
    <header data-mobile-preauth-header data-brand-href="./login.html"></header>

    <section class="login-card recovery-card" aria-labelledby="recovery-title">
      <div class="login-card__head">
        <h1 id="recovery-title">비밀번호 찾기</h1>
        <p>등록 이메일 인증 후 임시 비밀번호를 발급합니다.</p>
      </div>

      <nav class="recovery-steps" aria-label="비밀번호 찾기 단계">
        <button class="is-active" type="button" data-recovery-step="1"><b>1</b><span>아이디 확인</span></button>
        <button type="button" data-recovery-step="2"><b>2</b><span>Email 인증</span></button>
        <button type="button" data-recovery-step="3"><b>3</b><span>임시 비밀번호</span></button>
      </nav>

      <section class="recovery-stage" data-recovery-stage="1">
        <h2>아이디 확인</h2>
        <p>가입할 때 등록한 사용자 ID 또는 이메일을 입력하세요.</p>
        <form id="recovery-identify-form">
          <label class="login-field"><span>사용자 ID 또는 이메일<em>*</em></span><input id="recovery-identifier" type="text" value="fleet.admin@sejong-log.co.kr" autocomplete="username" required></label>
          <button class="recovery-primary" type="submit">다음</button>
        </form>
      </section>

      <section class="recovery-stage" data-recovery-stage="2" hidden>
        <h2>Email 본인 인증</h2>
        <p>가입 정보와 일치하는 이메일로 6자리 인증 코드를 발송합니다.</p>
        <form id="recovery-verify-form">
          <label class="login-field"><span>이름<em>*</em></span><input id="recovery-name" type="text" value="Sejong Kim" autocomplete="name" required></label>
          <label class="login-field"><span>등록 이메일<em>*</em></span><span class="recovery-control-row"><input id="recovery-email" type="email" value="fleet.admin@sejong-log.co.kr" autocomplete="email" required><button type="button" id="recovery-send">인증 코드 발송</button></span></label>
          <label class="login-field"><span>인증 코드<em>*</em></span><span class="recovery-control-row recovery-control-row--code"><input id="recovery-code" type="text" inputmode="numeric" maxlength="6" placeholder="6자리 코드"><button type="submit">확인</button></span></label>
          <div class="recovery-timer"><span>인증 코드 유효시간</span><strong id="recovery-timer">03:00</strong></div>
        </form>
      </section>

      <section class="recovery-stage recovery-complete" data-recovery-stage="3" hidden>
        <div class="recovery-complete__icon"><i data-lucide="key-round"></i></div>
        <h2>임시 비밀번호 발급</h2>
        <p>임시 비밀번호는 24시간 동안 유효합니다.</p>
        <strong class="temporary-password" id="temporary-password"></strong>
        <button class="recovery-secondary" id="copy-temporary-password" type="button">임시 비밀번호 복사</button>
        <div class="recovery-notice">임시 비밀번호로 로그인하면 새 비밀번호 설정 단계로 이동합니다.</div>
        <a class="recovery-primary recovery-primary--link" href="./login.html">로그인으로</a>
      </section>

      <nav class="account-links recovery-links" aria-label="계정 메뉴"><a href="./login.html">로그인으로</a><i></i><a href="./signup.html">회원가입</a></nav>
    </section>
    <footer class="login-footer">©2024 Bobcat Company. ALL RIGHTS RESERVED.</footer>
  </main>
  <div class="login-toast" role="status" aria-live="polite" hidden></div>
  <script src="./shared/layouts/vendor/lucide.min.js"></script>
  <script src="./signup-header.js?v=20260921-r88"></script>
  <script src="./find-password.js?v=20260921-r88"></script>
</body>
</html>
