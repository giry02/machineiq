<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff3600">
  <title>MACHINE IQ 사용자 모바일</title>
  <link rel="icon" href="./assets/favicon.ico">
  <link rel="stylesheet" href="./assets/local-fonts.css">
  <link rel="stylesheet" href="./shared/mobile-guide-tokens.css?v=20260904-4">
  <link rel="stylesheet" href="./shared/mobile.css?v=20260907-20">
  <link rel="stylesheet" href="./shared/mobile-type-compact.css?v=20260907-1">
  <link rel="stylesheet" href="./shared/home-tone-c.css?v=20260907-2">
  <link rel="stylesheet" href="./customer.css?v=20260910-r25">
</head>
<body class="mobile-type-compact mobile-tone-c customer-prototype">
  <div class="mobile-app">
    <header class="app-header">
      <button class="header-back" type="button" data-back aria-label="이전 화면" hidden><i data-lucide="chevron-left"></i></button>
      <div class="brand" id="brand"><img src="./shared/bobcat-machine-iq.svg" alt="Bobcat MACHINE IQ"></div>
      <strong class="header-title" id="header-title" hidden></strong>
      <button class="header-button" type="button" data-route="notifications" aria-label="알림 내역 보기"><i data-lucide="bell" aria-hidden="true"></i><b id="notification-count">0</b></button>
    </header>
    <main id="main" class="app-view is-active" tabindex="-1"></main>
    <noscript><p class="empty-state">화면을 보려면 JavaScript를 허용해 주세요.</p></noscript>
    <nav class="bottom-nav" aria-label="주 메뉴">
      <button type="button" data-route="home" class="is-active"><i data-lucide="house"></i><span>홈</span></button>
      <button type="button" data-route="summary"><i data-lucide="truck"></i><span>차량</span></button>
      <button type="button" data-route="services"><i data-lucide="clipboard-list"></i><span>서비스</span></button>
      <button type="button" data-route="reports"><i data-lucide="chart-no-axes-combined"></i><span>리포트</span></button>
      <button type="button" data-route="settings"><i data-lucide="settings"></i><span>설정</span></button>
    </nav>
  </div>
  <dialog class="location-dialog" id="location-dialog" aria-labelledby="location-dialog-title" data-screen-id="LQ-OPS-002-P01">
    <header><div><small>최종 수신 위치</small><h2 id="location-dialog-title"></h2></div><button type="button" id="location-dialog-close" data-close-map aria-label="지도 닫기"><i data-lucide="x"></i></button></header>
    <p id="location-dialog-address"></p>
    <div class="location-map-frame">
      <iframe id="location-map" title="Google 지도 · 차량 최종 수신 위치" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
      <button class="location-map-expand" id="location-map-expand" data-expand-map type="button" aria-label="지도 전체보기" aria-expanded="false" aria-controls="location-map" title="지도 전체보기"><i class="map-expand-icon" data-lucide="maximize" aria-hidden="true"></i><i class="map-collapse-icon" data-lucide="minimize" aria-hidden="true"></i></button>
    </div>
    <section class="location-dialog-info" aria-labelledby="location-info-title"><div class="location-info-heading"><h3 id="location-info-title">차량 정보</h3><span id="location-dialog-coordinate"></span></div><dl class="detail-definition" id="location-dialog-info"></dl><p>저장된 최종 수신 데이터입니다. 실시간 위치가 아니며, 원본에 없는 정보는 ‘정보 없음’으로 표시합니다.</p></section>
  </dialog>
  <script src="./shared/layouts/vendor/lucide.min.js"></script>
  <script src="./data/fleet.generated.js"></script>
  <script src="./model.js?v=20260910-r24"></script>
  <script src="./customer.js?v=20260910-r25"></script>
</body>
</html>
