<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>MACHINE IQ 고객 로그인</title>
  <link rel="icon" href="./assets/favicon.ico">
  <link rel="stylesheet" href="./assets/local-fonts.css">
  <link rel="stylesheet" href="./shared/mobile-guide-tokens.css?v=20260904-3">
  <link rel="stylesheet" href="./shared/mobile-preauth-header.css?v=20260905-1">
  <link rel="stylesheet" href="./shared/login.css?v=20260905-5">
  <link rel="stylesheet" href="./shared/mobile-type-compact.css?v=20260907-1">
</head>
<body data-screen-id="LQ-AUTH-003" class="mobile-type-compact mobile-tone-c" data-mobile-home="./index.html" data-mobile-login="./login.html">
  <main class="login-page">
    <header data-mobile-preauth-header data-language-id="login-language" data-brand-href="./login.html"></header>

    <section class="login-card" aria-labelledby="login-title">
      <div class="login-card__head">
        <h1 id="login-title">로그인</h1>
        <p>Bobcat MachineIQ Fleet Portal</p>
        <span>등록된 이메일 아이디로 로그인하세요.</span>
      </div>

      <form id="mobile-login-form">
        <label class="login-field"><span>아이디 (이메일)<em>*</em></span><input id="login-id" name="userId" type="text" value="fleet.admin@sejong-log.co.kr" autocomplete="username" required></label>
        <label class="login-field"><span>비밀번호<em>*</em></span><span class="password-input"><input id="login-password" name="password" type="password" value="password12!@" autocomplete="current-password" required><button type="button" id="password-toggle" aria-label="비밀번호 표시"><i data-lucide="eye"></i></button></span><small>12자 이상 · 숫자 + 영문 + 특수문자 조합</small></label>
        <div class="save-id-row"><label class="save-id"><input id="save-id" type="checkbox" checked><span>아이디 저장하기</span></label><span class="save-id-help">다음 접속 시 이메일 자동 입력</span></div>

        <div class="login-actions">
          <button class="login-submit" type="submit">로그인</button>
        </div>
        <nav class="account-links" aria-label="계정 메뉴"><a href="./find-password.html">비밀번호 찾기</a><i></i><a href="./signup.html">회원가입</a></nav>
      </form>

      <section id="forced-password-panel" hidden data-screen-id="LQ-AUTH-003-T01" aria-labelledby="forced-password-title">
        <div class="login-card__head"><h2 id="forced-password-title">새 비밀번호 설정</h2><p>임시 비밀번호를 새 비밀번호로 변경해 주세요.</p></div>
        <form id="forced-password-form" style="display:grid;gap:16px">
          <label class="login-field"><span>새 비밀번호<em>*</em></span><input id="forced-password" type="password" autocomplete="new-password" required><small>12자 이상 · 숫자 + 영문 + 특수문자 조합</small></label>
          <label class="login-field"><span>새 비밀번호 확인<em>*</em></span><input id="forced-password-confirm" type="password" autocomplete="new-password" required></label>
          <div class="login-actions"><button type="submit">변경 후 계속</button></div>
        </form>
      </section>
    </section>

    <footer class="login-footer">©2024 Bobcat Company. ALL RIGHTS RESERVED.</footer>
  </main>
  <div class="login-toast" role="status" aria-live="polite" hidden></div>
  <script src="./shared/layouts/vendor/lucide.min.js"></script>
  <script src="./signup-header.js?v=20260910-r24"></script>
  <script src="./login.js?v=20260910-r25"></script>
</body>
</html>
