<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<script src="../_shared/common-logic.js?v=d77b14750704&amp;rev=15dd4911055c"></script>
<link rel="stylesheet" href="../_shared/korean-layout.css?v=9e980f3cddea&amp;rev=495db444ef75"/>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>회원가입 · MACHINE IQ</title>
<script src="../_shared/customer-access.js?v=e12eedbcb072&amp;rev=e12eedbcb072"></script>
<link rel="icon" type="image/x-icon" href="../_shared/favicon.ico"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap"/>
<link rel="stylesheet" href="../_shared/mockup.css?v=bed1f0069135&amp;rev=bed1f0069135"/>
<link rel="stylesheet" href="../_shared/prelogin-shell.css?v=28d5a9ff2aba&amp;rev=28d5a9ff2aba"/>
<link rel="stylesheet" href="../_shared/auth-account-enhancements.css?v=c4f8e36adc2a&amp;rev=c4f8e36adc2a"/>
<link rel="stylesheet" href="../_shared/form-controls.css?v=6fda272acdcc&amp;rev=6fda272acdcc"/>
</head>
<body data-shell="none" data-variant="tobe" data-base="../" data-auth-page="registration" data-registration-mode="web">
<div class="aae-shell">
  <header data-miq-auth-header data-base="../"></header>
  <main class="aae-main">
    <div class="aae-registration" data-registration-flow>
      <div class="aae-page-heading">
        <h1>회원가입</h1>
        <p>계정 정보를 입력해 주세요. 차량은 회원가입 후 별도로 등록할 수 있습니다.</p>
      </div>

      <nav class="aae-reg-nav" aria-label="회원가입 단계">
        <button type="button" data-registration-step="agreement" aria-current="step">1. 약관 동의</button>
        <button type="button" data-registration-step="details" disabled>2. 정보 입력</button>
      </nav>

      <section id="registrationAgreement" aria-labelledby="registrationAgreementTitle">
        <div class="aae-reg-section">
          <h2 id="registrationAgreementTitle">약관 동의</h2>
          <div class="aae-agree-all">
            <label class="aae-check"><input type="checkbox" id="registrationAgreeAll"/><span data-registration-agree-all-text translate="no" lang="ko" dir="ltr"></span></label>
          </div>
          <div class="aae-agreements" data-registration-terms></div>
          <div class="aae-alert" id="agreementStatus" role="status" aria-live="polite" hidden></div>
          <div class="aae-actions" style="margin-top:16px">
            <button class="aae-button" type="button" data-registration-cancel>취소</button>
            <button class="aae-button aae-button--primary" id="registrationContinue" type="button" disabled>동의하고 정보 입력</button>
          </div>
        </div>
      </section>

      <section id="registrationDetails" aria-labelledby="registrationDetailsTitle" hidden>
        <form id="registrationForm" novalidate>
          <div class="aae-reg-section">
            <h2 id="registrationDetailsTitle">계정 정보</h2>
            <div class="aae-reg-grid">
              <div class="aae-field">
                <label class="aae-label" for="registrationUserId">사용자 ID <span class="aae-required">*</span></label>
                <div class="aae-control-row">
                  <input class="aae-control" id="registrationUserId" name="userId" type="text" placeholder="이메일 형식 또는 아이디 (영어, 숫자 6자리 이상)" autocomplete="username" data-required="true"/>
                  <button class="aae-button" id="registrationCheckId" type="button">중복확인</button>
                </div>
                <span class="aae-error" data-error-for="registrationUserId"></span>
                <div class="aae-alert" id="registrationUserIdStatus" role="status" aria-live="polite" hidden></div>
              </div>
              <div class="aae-field">
                <label class="aae-label" for="registrationName">이름 <span class="aae-required">*</span></label>
                <input class="aae-control" id="registrationName" name="name" type="text" autocomplete="name" data-required="true"/>
                <span class="aae-error" data-error-for="registrationName"></span>
              </div>
              <div class="aae-field">
                <label class="aae-label" for="registrationEmail">인증 이메일 <span class="aae-required">*</span></label>
                <div class="aae-control-row">
                  <input class="aae-control" id="registrationEmail" name="email" type="email" autocomplete="email" data-required="true"/>
                  <button class="aae-button" id="registrationSendEmail" type="button">코드 발송</button>
                </div>
                <span class="aae-error" data-error-for="registrationEmail"></span>
              </div>
              <div class="aae-field">
                <label class="aae-label" for="registrationEmailCode">인증 코드 <span class="aae-required">*</span></label>
                <div class="aae-control-row">
                  <input class="aae-control" id="registrationEmailCode" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" disabled/>
                  <button class="aae-button" id="registrationVerifyEmail" type="button" disabled>확인</button>
                  <button class="aae-button" id="registrationResendEmail" type="button" disabled>재발송</button>
                </div>
                <span class="aae-help">남은 시간 <strong id="registrationEmailTimer">03:00</strong></span>
                <span class="aae-error" data-error-for="registrationEmailCode"></span>
                <div class="aae-alert" id="registrationEmailStatus" role="status" aria-live="polite" hidden></div>
              </div>
              <div class="aae-field">
                <label class="aae-label" for="registrationCountry">국가 <span class="aae-required">*</span></label>
                <select class="aae-select" id="registrationCountry" name="country" data-required="true">
                  <option value="">국가를 선택하세요</option><option value="KR" selected>대한민국 (Korea)</option><option value="US">미국 (United States)</option><option value="CN">중국 (China)</option><option value="JP">일본 (Japan)</option><option value="DE">독일 (Germany)</option><option value="AU">호주 (Australia)</option><option value="GB">영국 (United Kingdom)</option><option value="FR">프랑스 (France)</option>
                </select>
                <span class="aae-error" data-error-for="registrationCountry"></span>
              </div>
              <div class="aae-field">
                <label class="aae-label" for="registrationPhone">전화번호 <span class="aae-required">*</span></label>
                <div class="aae-tel"><span class="aae-tel__prefix" id="registrationTelPrefix">+82</span><input class="aae-control" id="registrationPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="국가번호 제외 숫자" data-required="true"/></div>
                <span class="aae-error" data-error-for="registrationPhone"></span>
              </div>
              <div class="aae-field">
                <label class="aae-label" for="registrationPassword">비밀번호 <span class="aae-required">*</span></label>
                <div class="aae-control-wrap">
                  <input class="aae-control" id="registrationPassword" name="password" type="password" autocomplete="new-password" data-required="true"/>
                  <button class="aae-password-toggle" type="button" data-password-toggle="registrationPassword" aria-pressed="false">표시</button>
                </div>
                <span class="aae-help">12자 이상 · 영문 + 숫자 + 특수문자</span>
                <span class="aae-error" data-error-for="registrationPassword"></span>
              </div>
              <div class="aae-field">
                <label class="aae-label" for="registrationPasswordConfirm">비밀번호 확인 <span class="aae-required">*</span></label>
                <div class="aae-control-wrap">
                  <input class="aae-control" id="registrationPasswordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" data-required="true"/>
                  <button class="aae-password-toggle" type="button" data-password-toggle="registrationPasswordConfirm" aria-pressed="false">표시</button>
                </div>
                <span class="aae-error" data-error-for="registrationPasswordConfirm"></span>
              </div>
            </div>
          </div>

          <div class="aae-reg-section">
            <h2>소속 · 역할</h2>
            <div class="aae-reg-grid">
              <fieldset class="aae-field aae-span-2" style="border:0;padding:0">
                <legend class="aae-label">역할 / 구분 <span class="aae-required">*</span></legend>
                <div class="aae-role-group">
                  <label class="aae-role"><input type="radio" name="registrationRole" value="customer-owner" checked/>고객사 - 대표</label>
                  <label class="aae-role"><input type="radio" name="registrationRole" value="customer-employee"/>고객사 - 직원</label>
                  <label class="aae-role"><input type="radio" name="registrationRole" value="dealer-employee"/>딜러 - 직원</label>
                </div>
              </fieldset>
              <div class="aae-field" data-registration-roles="dealer-employee" hidden>
                <label class="aae-label" for="registrationRegion">지역 <span class="aae-required">*</span></label>
                <input class="aae-control" id="registrationRegion" name="region" data-required="true" readonly disabled placeholder="국가 선택 시 자동 설정"/>
                <span class="aae-error" data-error-for="registrationRegion"></span>
              </div>
              <div class="aae-field" data-registration-roles="dealer-employee" hidden>
                <label class="aae-label" for="registrationDealer">소속 딜러 <span class="aae-required">*</span></label>
                <select class="aae-select" id="registrationDealer" name="dealer" data-required="true" disabled><option value="">딜러를 선택하세요</option></select>
                <span class="aae-help" id="registrationDealerHelp">국가를 먼저 선택해 주세요.</span>
                <span class="aae-error" data-error-for="registrationDealer"></span>
              </div>
              <div class="aae-field" data-registration-roles="customer-owner,customer-employee">
                <label class="aae-label" for="registrationCompany"><span id="registrationCompanyLabel">신규 업체명</span> <span class="aae-required">*</span></label>
                <div class="aae-autocomplete">
                  <input class="aae-control" id="registrationCompany" name="company" type="text" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="registrationCompanyList" aria-expanded="false" data-required="true"/>
                  <div class="aae-autocomplete-list" id="registrationCompanyList" role="listbox" hidden></div>
                </div>
                <span class="aae-help" id="registrationCompanyHelp"></span>
                <span class="aae-error" data-error-for="registrationCompany"></span>
              </div>
            </div>
          </div>

          <div class="aae-alert" id="registrationStatus" role="status" aria-live="polite" hidden></div>
          <div class="aae-reg-footer">
            <button class="aae-button" type="button" data-registration-cancel>취소</button>
            <button class="aae-button aae-button--primary" id="registrationSubmit" type="submit">회원가입</button>
          </div>
        </form>
      </section>
    </div>
  </main>
</div>
<script src="../_shared/prelogin-shell.js?v=1ef2bda7d29f&amp;rev=1ef2bda7d29f"></script>
<script src="../_shared/registration-terms-data.js?v=ec5c841643ca&amp;rev=d32a2e859e30"></script>
<script src="../_shared/registration-terms.js?v=edc207d22f4a&amp;rev=96502ba6b2eb"></script>
<script src="../_shared/auth-account-enhancements.js?v=da8ceaf97ed3&amp;rev=0a8cada7e4a3"></script>
</body>
</html>
