<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>차량 등록 안내 · MACHINE IQ</title>

<link rel="icon" href="../_shared/favicon.ico"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap"/>

</head>
<body data-shell="none" data-auth-page="vehicle-required" data-screen-id="LQ-AUTH-006">
<div class="aae-shell">
  <header data-miq-auth-header data-base="../"></header>
  <main class="aae-main">
    <section class="aae-onboarding aae-registration" aria-labelledby="vehicleRequiredTitle">
      <div class="aae-reg-section">
        <h1 id="vehicleRequiredTitle">차량 등록이 필요합니다.</h1>
        <p>현재 이용할 수 있는 차량이 없습니다.<br/>서비스를 이용하려면 차량을 등록해 주세요.</p>
        <p id="requiredHelp">이미 등록을 신청했다면 승인 후 이용할 수 있습니다.</p>
        <div class="aae-onboarding__actions">
          <a class="aae-button aae-button--primary" id="requiredRegister" href="../Mgmt%20Vehicle/mgmt-vehicle-tobe.html?role=customer_owner&amp;register=1">차량 등록</a>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="../_shared/prelogin-shell.js?v=d5ca90de4262&amp;rev=a7fa44d7644d"></script>
<script>
(function(){
  var access=window.MIQCustomerAccess;
  if(!access.isCustomer(access.role())){location.replace(access.url('dashboard'));return;}
  document.getElementById('requiredRegister').href=access.url('vehicle');
  if(access.role()==='customer_staff'){
    MIQCommon.view.set(document.getElementById('requiredHelp'),"textContent",'소속 업체 대표에게 차량 등록과 조회 그룹 배정을 요청해 주세요.');
    MIQCommon.view.set(document.getElementById('requiredRegister'),"textContent",'차량 등록 확인');
  }
})();
</script>
</body>
</html>
