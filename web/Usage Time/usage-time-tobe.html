<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>운행이력 - 운행시간</title>
<link rel="stylesheet" href="../_shared/chart-common.css?rev=fc1c23dcf6af"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap"/>
<link rel="stylesheet" href="../_shared/mockup.css?rev=d24057a14011"/>
<link rel="stylesheet" href="../_shared/content-system.css?v=20260902-readability&amp;rev=d8f94e7e5049"/>
<link rel="stylesheet" href="../_shared/operation-metrics-enhancements.css?v=20260903-common-layout-r4&amp;rev=a369098bff2a"/>
<link rel="stylesheet" href="../_shared/usage-time-enhancements.css?v=20260906-period-search-r1&amp;rev=2e6a0f678ee1"/>
</head>
<body data-period-presets="dwm" class="miq-content-system miq-operation-metrics miq-usage-time" data-gnb="anlz" data-sub="usage" data-variant="tobe" data-base="../">

<div id="gnb"></div>

<div class="layout">
  <aside class="lnb" id="lnb"></aside>

  <main class="main">
    <div class="page-head">
      <h1 class="page-head__title miq-page-title">운행시간</h1>
      <div class="page-head__bc"><a data-context-link href="../Vehicle%20Summary/vehicle-summary-tobe-3.html">운행이력</a> &gt; 운행시간</div>
    </div>

    <div class="filter-bar miq-period-filter usage-month-filter" id="usageFilter" aria-label="운행시간 조회">
      <div class="period-tabs" role="group" aria-label="조회 기간 단위">
        <button type="button" data-period="d">일</button>
        <button type="button" data-period="w">주</button>
        <button type="button" class="active" data-period="m">월</button>
        </div>
      <input type="date" class="miq-date-input" id="usageFrom" value="2026-09-01" aria-label="조회 시작일"/>
      <span class="miq-date-separator">~</span>
      <input type="date" class="miq-date-input" id="usageTo" value="2026-09-05" aria-label="조회 종료일"/>
      <button class="btn-search" type="button" id="usageSearch">조회</button>
      <button class="btn" type="button" id="usageExport">내보내기</button>
    </div>
    <p class="metrics-feedback miq-sr-only" id="metricsFeedback" role="status" aria-live="polite"></p>
    <div class="miq-analysis-scope" id="usageScopeSummary" data-miq-scope-placement="title" aria-label="현재 운행시간 집계 범위" aria-live="polite"></div>

    <section class="box total" aria-labelledby="usageSummaryTitle">
      <div class="box__head">
        <h2 class="box__name tot" id="usageSummaryTitle">2026년 8월 요약</h2>
        <div class="box__tools"><span class="usage-summary-meta" id="usageSummaryMeta">대상 차량 집계 중</span></div>
      </div>
      <div class="stat-cells c3 usage-summary-cells">
        <div class="cell"><div class="cell__v" id="usageSumWork">-</div><div class="cell__k">총 작업시간</div></div>
        <div class="cell"><div class="cell__v" id="usageSumDistance">-</div><div class="cell__k">총 이동거리</div></div>
        <div class="cell hl"><div class="cell__v" id="usageSumOperating">-</div><div class="cell__k">운영 장비 수 <span class="tip" tabindex="0" role="button" aria-label="운영 장비 수 집계 기준">?<span class="tip__box">일 작업시간이 30분 이상인 차량을 운영 장비로 집계하며, 월 값은 운영 장비가 1대 이상인 날의 일평균입니다.</span></span></div></div>
      </div>
    </section>

    <section class="box usage-calendar-box" aria-labelledby="usageCalendarTitle">
      <div class="box__head">
        <h2 class="box__name" id="usageCalendarTitle">일별 사용 현황</h2>
      </div>
      <div class="cal" id="usageCalendar" aria-label="월간 운행시간 캘린더"></div>
      <div class="cal__note">
        <span>집계 전: 아직 데이터가 수집되지 않은 날짜</span>
        <span class="grow"></span>
        <span>날짜 선택 시 차량별 상세를 확인할 수 있습니다.</span>
      </div>
    </section>
  </main>
</div>

<div class="dim" id="dayModal">
  <div class="modal lg" role="dialog" aria-modal="true" aria-labelledby="dayModalTitle">
    <div class="modal__head">
      <div class="modal__title" id="dayModalTitle">일별 운행시간 상세</div>
      <button class="modal__x" type="button" data-modal-close aria-label="닫기">✕</button>
    </div>
    <div class="modal__body">
      <div class="stat-cells c3 usage-day-summary" id="usageDaySummary"></div>
      <div class="sub-head">차량별 내역 <span class="tail" id="usageDayMeta"></span></div>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr><th>차량</th><th>분류</th><th>그룹</th><th class="r">작업시간</th><th class="r">이동거리</th><th class="c">운영 판정</th></tr>
          </thead>
          <tbody id="usageDayRows"></tbody>
        </table>
      </div>
    </div>
    <div class="modal__foot">
      <button class="btn" type="button" data-modal-close>닫기</button>
      <a class="btn btn--pri" id="dayEfficiencyLink" data-context-link href="../Operational%20Efficiency/operational-efficiency-tobe.html">해당일 운영효율 화면으로</a>
    </div>
  </div>
</div>

<script src="../_mock-data/generated/fleet.generated.js?v=20260906-json-r1&amp;rev=7e813828c801"></script>

<script src="../_shared/meeting-model.js?rev=d195eb0eec48"></script>
<script src="../_shared/common-logic.js?v=20260907-common-logic-r42&amp;rev=eee81a6f747c"></script>
<script src="../_shared/nav.js?v=20260907-common-logic-r42&amp;rev=876cf90f11d8"></script>
<script src="../_shared/chart-common.js?rev=26b243959957"></script>
<script src="../_shared/usage-time-enhancements.js?v=20260906-period-search-r1&amp;rev=27abacb0e97b"></script>
</body>
</html>
