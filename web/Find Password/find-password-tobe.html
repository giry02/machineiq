<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bobcat MACHINE IQ 비밀번호 찾기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap"/>
<link rel="stylesheet" href="../_shared/mockup.css"/>
<link rel="stylesheet" href="../_shared/prelogin-shell.css"/>
<link rel="stylesheet" href="../_shared/auth-account-enhancements.css"/>
</head>
<body data-shell="none" data-variant="tobe" data-base="../" data-auth-page="find-password">
<div class="aae-shell">
  <header data-miq-auth-header data-base="../"></header>

  <main class="aae-main aae-main--recovery" data-recovery-flow>
    <div class="aae-page-heading">
      <h1>비밀번호 찾기</h1>
      <p>등록 이메일 인증 후 24시간 동안 사용할 수 있는 임시 비밀번호를 발급합니다.</p>
    </div>

    <nav class="aae-steps" aria-label="비밀번호 찾기 단계">
      <button class="aae-step" type="button" data-recovery-step="1" aria-current="step"><b>1</b>아이디 확인</button>
      <button class="aae-step" type="button" data-recovery-step="2" disabled><b>2</b>Email 인증</button>
      <button class="aae-step" type="button" data-recovery-step="3" disabled><b>3</b>임시 비밀번호</button>
    </nav>

    <section class="aae-card aae-stage" data-recovery-stage="1" aria-labelledby="recoveryStep1Title">
      <div class="aae-card__body">
        <div class="aae-card__head">
          <h2 class="aae-card__title" id="recoveryStep1Title">1. 아이디 확인</h2>
          <p class="aae-card__desc">가입할 때 등록한 사용자 ID 또는 이메일을 입력하세요.</p>
        </div>
        <form class="aae-form" id="recoveryIdentifyForm" novalidate>
          <div class="aae-field">
            <label class="aae-label" for="recoveryIdentifier">사용자 ID 또는 이메일 <span class="aae-required" aria-hidden="true">*</span></label>
            <input class="aae-control" id="recoveryIdentifier" type="text" value="fleet.admin@sejong-log.co.kr" autocomplete="username" aria-describedby="recoveryIdentifierError" required/>
            <span class="aae-error" id="recoveryIdentifierError" data-error-for="recoveryIdentifier"></span>
          </div>
          <button class="aae-button aae-button--primary aae-button--wide" type="submit">다음</button>
        </form>
      </div>
    </section>

    <section class="aae-card aae-stage" data-recovery-stage="2" aria-labelledby="recoveryStep2Title" hidden>
      <div class="aae-card__body">
        <div class="aae-card__head">
          <h2 class="aae-card__title" id="recoveryStep2Title">2. Email 본인 인증</h2>
          <p class="aae-card__desc">가입 정보와 일치하는 이메일로 6자리 인증 코드를 발송합니다.</p>
        </div>
        <form class="aae-form" id="recoveryVerifyForm" novalidate>
          <div class="aae-field">
            <label class="aae-label" for="recoveryName">이름 <span class="aae-required" aria-hidden="true">*</span></label>
            <input class="aae-control" id="recoveryName" type="text" value="Sejong Kim" autocomplete="name" aria-describedby="recoveryNameError" required/>
            <span class="aae-error" id="recoveryNameError" data-error-for="recoveryName"></span>
          </div>
          <div class="aae-field">
            <label class="aae-label" for="recoveryEmail">등록 이메일 <span class="aae-required" aria-hidden="true">*</span></label>
            <div class="aae-control-row">
              <input class="aae-control" id="recoveryEmail" type="email" value="fleet.admin@sejong-log.co.kr" autocomplete="email" aria-describedby="recoveryEmailError" required/>
              <button class="aae-button aae-button--secondary" id="recoverySend" type="button">인증 코드 발송</button>
            </div>
            <span class="aae-error" id="recoveryEmailError" data-error-for="recoveryEmail"></span>
          </div>
          <div class="aae-field">
            <label class="aae-label" for="recoveryCode">인증 코드 <span class="aae-required" aria-hidden="true">*</span></label>
            <div class="aae-control-row">
              <input class="aae-control" id="recoveryCode" type="text" inputmode="numeric" maxlength="6" placeholder="6자리 코드" autocomplete="one-time-code" aria-describedby="recoveryCodeError" disabled required/>
              <button class="aae-button" id="recoveryVerify" type="submit" disabled>확인</button>
              <button class="aae-button" id="recoveryResend" type="button" disabled>재발송</button>
            </div>
            <span class="aae-error" id="recoveryCodeError" data-error-for="recoveryCode"></span>
          </div>
          <div class="aae-timer-row"><span>인증 코드 유효시간</span><strong id="recoveryTimer">03:00</strong></div>
          <div class="aae-timer-track" aria-hidden="true"><span id="recoveryTimerBar"></span></div>
          <div class="aae-alert" id="recoveryMailStatus" role="status" aria-live="polite" hidden></div>
        </form>
      </div>
    </section>

    <section class="aae-card aae-stage" data-recovery-stage="3" aria-labelledby="recoveryStep3Title" hidden>
      <div class="aae-card__body">
        <div class="aae-card__head">
          <h2 class="aae-card__title" id="recoveryStep3Title">3. 임시 비밀번호 발급</h2>
          <p class="aae-card__desc">아래 임시 비밀번호는 이메일로도 발송되며 24시간 동안 유효합니다.</p>
        </div>
        <div class="aae-form">
          <div class="aae-temp-password" id="temporaryPassword" aria-label="발급된 임시 비밀번호"></div>
          <button class="aae-button" id="copyTemporaryPassword" type="button">임시 비밀번호 복사</button>
          <div class="aae-alert" id="temporaryCopyStatus" role="status" aria-live="polite" hidden></div>
          <div class="aae-alert is-warning">임시 비밀번호로 로그인하면 새 비밀번호 설정 단계로 이동합니다.</div>
          <a class="aae-button aae-button--primary aae-button--wide" href="../Login/login-tobe.html">로그인으로</a>
        </div>
      </div>
    </section>

    <div class="aae-link-row">
      <a href="../Login/login-tobe.html">로그인으로</a>
      <span aria-hidden="true">·</span>
      <a href="../registration/web-registration-tobe-v3.html">회원가입</a>
    </div>
  </main>
</div>
<script src="../_shared/prelogin-shell.js"></script>
<script src="../_shared/auth-account-enhancements.js?v=20260903-a-default"></script>
</body>
</html>
