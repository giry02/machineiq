<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>운행이력 - 요약정보 TO-BE v2 (Mock-up)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap"/>
<link rel="stylesheet" href="../_shared/gnb.css?rev=b9f0ddfcf14c"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;font-size:14px;background:#f9f9f9;color:#333}
button,input,select{font:inherit}
button{cursor:pointer}

.layout{display:flex;min-height:calc(100vh - 52px)}
.lnb{width:248px;flex-shrink:0;padding:20px 0;border-right:1px solid #eaeaea;background:#fff}
.main{flex:1;min-width:0;padding:24px 28px}
.summary-content{max-width:none!important;container-name:summary-content;container-type:inline-size}

/* 제목·기간 조회 */
.summary-titlebar{display:flex;align-items:center;min-height:40px;margin-bottom:14px;gap:10px}
.summary-titlebar .miq-page-title{font-size:24px}
.summary-titlebar .miq-page-scope{margin-left:0}
.summary-breadcrumb{display:none;color:#767676;font-size:12px;white-space:nowrap}
.summary-breadcrumb a{color:inherit;text-decoration:none}
.filter-bar{display:flex;align-items:center;gap:6px;margin-left:auto}
.period-tabs{display:flex;overflow:hidden;border:1px solid #dfdfdf;border-radius:4px;background:#fff}
.period-tabs button{height:40px;padding:0 16px;border:0;border-right:1px solid #dfdfdf;background:#fff;color:#666;font-size:13px}
.period-tabs button:last-child{border-right:0}
.period-tabs button.active{background:#333;color:#fff;font-weight:700}
.date-range{display:flex;align-items:center;gap:5px;height:40px;padding:0 12px;border:1px solid #dfdfdf;border-radius:4px;background:#fff;color:#666;font-size:13px;white-space:nowrap}
.date-range input{width:130px;height:34px;padding:0 5px;border:0;background:transparent;color:#333;font-size:13px;outline:0}
.summary-titlebar .btn-search{height:40px!important;min-height:40px!important;padding:0 18px!important;border:0;border-radius:4px;background:#ff3600;color:#fff;font-size:14px;font-weight:700}

/* 두 개의 수평 밴드: 조회 범위 / 기간·효율·이벤트 */
.summary-card{position:relative;overflow:visible;margin-bottom:14px;border-top:2px solid #003263;background:#fff}
.summary-overview{grid-template-rows:auto auto}
.summary-scope{display:grid;grid-template-columns:minmax(210px,1.25fr) repeat(4,minmax(100px,1fr));min-width:0;min-height:58px;border-bottom:1px solid #eaeaea}
.summary-scope__lead{display:flex;align-items:center;gap:14px;min-width:0;padding:8px 16px;background:#f1f8fe}
.summary-scope__lead .miq-metric-group__title{flex:0 0 auto}
.summary-primary{display:flex;align-items:baseline;gap:4px;color:#333}
.summary-primary strong{font-size:26px;line-height:30px;font-weight:700;letter-spacing:-.03em}
.summary-primary span{color:#666;font-size:13px;font-weight:600}
.summary-primary small{margin-left:4px;color:#767676;font-size:12px;font-weight:500;white-space:nowrap}

.fleet-breakdown{display:contents}
.fleet-breakdown__item{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;min-height:58px;padding:8px 12px;border-left:1px solid #eaeaea}
.fleet-breakdown__name{overflow:hidden;color:#666;font-size:12px;font-weight:600;line-height:18px;text-overflow:ellipsis;white-space:nowrap}
.fleet-breakdown__count{color:#333;font-size:17px;font-weight:700;line-height:24px;white-space:nowrap}
.fleet-breakdown__rail{display:none}
.fleet-breakdown__fill{display:block;width:calc(var(--value) * 100%);height:100%;border-radius:inherit;background:#ff3600;transform:scaleX(1);transform-origin:left;transition:transform .48s cubic-bezier(.2,.75,.25,1)}
.summary-card.is-animating:not(.is-ready) .fleet-breakdown__fill{transform:scaleX(0)}
.summary-card.is-ready .fleet-breakdown__fill{transform:scaleX(1)}

.summary-detail-grid{display:grid;grid-template-columns:2fr 3fr 1fr;min-width:0}
.summary-group{position:relative;min-width:0}
.summary-group+.summary-group{border-left:1px solid #eaeaea}
.summary-group__head{display:flex;align-items:center;height:32px;padding:0 15px;border-bottom:1px solid #eaeaea;background:#f9f9f9}
.summary-group__head h2{color:#273247;font-size:15px;font-weight:700}

.period-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-height:62px}
.period-metric{min-width:0;padding:6px 15px}
.period-metric+.period-metric{border-left:1px solid #eaeaea}
.period-metric__label,.efficiency-row__label,.event-metric__label{display:block;color:#666;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}
.period-metric__value{display:flex;align-items:baseline;gap:4px;margin-top:2px;color:#333;white-space:nowrap}
.period-metric__value strong{font-size:22px;line-height:28px;font-weight:700}
.period-metric__value span{color:#666;font-size:12px}

.efficiency-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));min-height:62px}
.efficiency-row{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:0 13px}
.efficiency-row+.efficiency-row{border-left:1px solid #eaeaea}
.efficiency-row__label{overflow:hidden;min-width:0;text-overflow:ellipsis}
.efficiency-row__value{color:#333;font-size:17px;font-weight:700;line-height:23px;white-space:nowrap}
.efficiency-row__meta{overflow:hidden;color:#767676;font-size:11px;line-height:16px;text-overflow:ellipsis;white-space:nowrap}

.event-metric{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;align-content:center;align-items:center;column-gap:8px;min-height:62px;padding:4px 15px}
.event-metric__value{display:flex;align-items:center;gap:5px;color:#333}
.event-metric__value::before{content:'';width:6px;height:6px;border-radius:50%;background:#ec2d2d}
.event-metric__value strong{font-size:22px;line-height:28px;font-weight:700}
.event-metric__value span{color:#666;font-size:12px;font-weight:600}
.event-metric__meta{grid-column:1/-1;color:#767676;font-size:11px;line-height:16px}

.summary-value{opacity:1;transform:none;transition:opacity .18s ease,transform .18s ease}
.summary-card.is-animating:not(.is-ready) .summary-value{opacity:.72;transform:translateY(2px)}
.summary-card.is-ready .summary-value{opacity:1;transform:none}
.summary-help-popover{position:absolute;z-index:20;top:96px;right:16px;width:min(360px,calc(100% - 32px));padding:12px 14px;border:1px solid #dfdfdf;border-radius:6px;background:#fff;color:#666;box-shadow:0 6px 20px rgba(0,0,0,.12);font-size:12px;line-height:18px}
.summary-help-popover::before{content:'';position:absolute;top:-5px;right:92px;width:8px;height:8px;border-top:1px solid #dfdfdf;border-left:1px solid #dfdfdf;background:#fff;transform:rotate(45deg)}
.summary-help-popover[hidden]{display:none}

/* 차량 리스트 */
.list-head{display:flex;align-items:center;min-height:30px;margin-bottom:8px;gap:8px}
.list-head .tools{display:flex;align-items:center;gap:7px;margin-left:auto}
.hint{color:#767676;font-size:12px}

.vlist-wrap{position:relative;overflow:visible;background:#fff}
.vlist{width:100%;table-layout:fixed;border-collapse:collapse;white-space:nowrap}
.vlist col:nth-child(1){width:20%}
.vlist col:nth-child(2){width:13%}
.vlist col:nth-child(3){width:17%}
.vlist col:nth-child(4){width:17%}
.vlist col:nth-child(5){width:13%}
.vlist col:nth-child(6){width:10%}
.vlist col:nth-child(7){width:10%}
.vlist th{height:56px;padding:7px 10px!important;text-align:left!important;background:#f1f8fe!important;cursor:default!important}
.vlist td{height:60px!important;padding:7px 10px!important}
.vlist th.c,.vlist td.c{text-align:center!important}
.vlist tbody tr{animation:rowEnter .18s ease both;animation-delay:var(--row-delay,0ms)}
.vlist tbody tr:hover{background:#f9f9f9;cursor:pointer}
.vlist tbody tr.sel{background:#f1f8fe}
.vlist tbody tr:focus-visible{position:relative;z-index:1;outline:2px solid #ff3600;outline-offset:-2px}
.th-main{display:block;margin-bottom:3px;color:#273247;font-size:14px;font-weight:700;line-height:20px}
.th-sorts{display:flex;align-items:center;gap:4px;min-width:0}
.sort-trigger{display:inline-flex;align-items:center;gap:2px;min-width:0;padding:1px 0;border:0;background:transparent;color:#767676;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}
.sort-trigger:hover,.sort-trigger:focus-visible{color:#333}
.sort-trigger:focus-visible{outline:2px solid #ff3600;outline-offset:2px}
.sort-trigger .ind{display:inline-block;width:8px;color:#ff3600;font-size:11px;opacity:0}
.sort-trigger:hover .ind,.sort-trigger:focus-visible .ind,.sort-trigger.is-sorted .ind{opacity:1}
.sort-trigger.is-sorted{color:#333;font-weight:700}
.period-flag{display:inline-flex;align-items:center;height:20px;margin-left:3px;padding:0 5px;border:1px solid #dfdfdf;border-radius:3px;color:#ff3600;font-size:11px;font-weight:700}

.v-vin{font-size:14px!important}
.v-model{font-size:12px!important;color:#767676!important}
.affiliation-cell__group{display:block;overflow:hidden;color:#333;font-size:14px;font-weight:700;line-height:20px;text-overflow:ellipsis}
.affiliation-cell__type{display:block;margin-top:2px;color:#767676;font-size:12px;line-height:18px}
.metric-pair-cell{display:grid;gap:4px}
.metric-pair-cell__line{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:baseline;gap:5px}
.metric-pair-cell__line span{color:#767676;font-size:12px;line-height:18px}
.metric-pair-cell__line strong{overflow:hidden;color:#333;font-size:14px;font-weight:600;line-height:20px;text-align:right;text-overflow:ellipsis}
.efficiency-cell__kind{display:block;color:#767676;font-size:12px;line-height:18px}
.efficiency-cell__value{display:block;margin-top:2px;color:#333;font-size:14px;font-weight:700;line-height:20px}
.na{color:#999}

.conn{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:13px;background:#f3f3f3;color:#333;font-size:12px;font-weight:600;line-height:16px}
.conn .dot{width:6px;height:6px;border-radius:50%;background:#999}
.conn.on .dot{background:#00ad83}
.conn.off{color:#767676}

.batt{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.batt__cell{position:relative;display:flex;align-items:center;width:36px;height:17px;padding:2px;border:1.5px solid #666;border-radius:3px}
.batt__cell::after{content:'';position:absolute;right:-4px;top:50%;width:2px;height:6px;border-radius:0 2px 2px 0;background:#666;transform:translateY(-50%)}
.batt__fill{height:100%;border-radius:1px;transform:scaleX(0);transform-origin:left;transition:transform .28s ease}
.vlist tbody tr .batt__fill{transform:scaleX(1)}
.batt__val{color:#333;font-size:12px;font-weight:700}

@keyframes rowEnter{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

@container summary-content (max-width:850px){
  .summary-titlebar{flex-wrap:wrap}
  .summary-breadcrumb{order:2}
  .filter-bar{order:3;width:100%;margin-left:0}
  .summary-scope{grid-template-columns:minmax(180px,1.2fr) repeat(4,minmax(90px,1fr))}
  .summary-detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .summary-group:nth-child(3){grid-column:1/-1;border-top:1px solid #eaeaea;border-left:0}
}

@container summary-content (max-width:900px){
  .vlist col:nth-child(1){width:18%}
  .vlist col:nth-child(2){width:12%}
  .vlist col:nth-child(3),.vlist col:nth-child(4){width:18%}
  .vlist col:nth-child(5){width:14%}
  .vlist th,.vlist td{padding-inline:6px!important}
  .metric-pair-cell__line{grid-template-columns:26px minmax(0,1fr);gap:3px}
  .v-vin{font-size:13px!important}
}

@container summary-content (max-width:720px){
  .summary-scope{grid-template-columns:repeat(2,minmax(0,1fr))}
  .summary-scope__lead{grid-column:1/-1}
  .fleet-breakdown__item{border-top:1px solid #eaeaea}
  .fleet-breakdown__item:nth-child(odd){border-left:0}
  .summary-detail-grid{grid-template-columns:1fr}
  .summary-group+.summary-group{border-top:1px solid #eaeaea;border-left:0}
  .summary-group:nth-child(3){grid-column:auto}
  .filter-bar{flex-wrap:wrap}
  .vlist-wrap{overflow-x:auto}
  .vlist{min-width:900px}
}

@media (prefers-reduced-motion:reduce){
  .fleet-breakdown__fill,.summary-value,.batt__fill{transition:none}
  .vlist tbody tr{animation:none}
}
</style>

<body class="miq-content-system miq-content-summary" data-gnb="anlz" data-sub="summary" data-variant="tobe" data-base="../">

<div id="gnb"></div>

<div class="layout">
  <aside class="lnb" id="lnb"></aside>

  <main class="main">
    <div class="summary-content miq-content-frame">
      <header class="summary-titlebar">
        <h1 class="miq-page-title">요약정보</h1>
        <span class="miq-page-scope" id="scopeTitle">- 전체</span>
        <span class="summary-breadcrumb"><a href="vehicle-summary-tobe-v2.html">운행이력</a> &gt; 요약정보</span>
        <div class="filter-bar">
          <div class="period-tabs" id="periodTabs" role="group" aria-label="조회 기간 단위">
            <button type="button" data-period="d">일</button>
            <button type="button" data-period="w">주</button>
            <button type="button" class="active" data-period="m">월</button>
            <button type="button" data-period="c">사용자설정</button>
          </div>
          <div class="date-range" id="dateRange">2026-07-01 ~ 2026-07-31</div>
          <button type="button" class="btn-search miq-button miq-button--primary">조회</button>
        </div>
      </header>

      <section class="summary-card miq-panel" id="summaryCard" aria-label="조회 범위 요약">
        <div class="summary-overview miq-overview-grid">
          <div class="summary-scope">
            <div class="summary-scope__lead miq-metric-group">
              <h2 class="miq-metric-group__title">조회 범위</h2>
              <div class="summary-primary summary-value"><strong class="miq-number" id="sumFleet">0</strong><span>대</span><small>현재 필터 기준</small></div>
            </div>
            <div class="fleet-breakdown" id="fleetChips" aria-label="동력 유형별 차량 구성"></div>
          </div>

          <div class="summary-detail-grid">
            <div class="summary-group miq-metric-group">
              <div class="summary-group__head">
                <h2 class="miq-metric-group__title">기간 운행 <button type="button" class="miq-help" data-help="선택 기간에 기록된 차량별 이동거리와 가동시간의 합계입니다." aria-label="기간 운행 설명" aria-expanded="false">?</button></h2>
              </div>
              <div class="period-metrics">
                <div class="period-metric miq-metric">
                  <span class="period-metric__label miq-metric__label">이동거리</span>
                  <span class="period-metric__value summary-value"><strong class="miq-number" id="sumKm">-</strong><span>Km</span></span>
                </div>
                <div class="period-metric miq-metric">
                  <span class="period-metric__label miq-metric__label">가동시간</span>
                  <span class="period-metric__value summary-value"><strong class="miq-number" id="sumHour">-</strong><span>H</span></span>
                </div>
              </div>
            </div>

            <div class="summary-group miq-metric-group">
              <div class="summary-group__head">
                <h2 class="miq-metric-group__title">효율·소비 <button type="button" class="miq-help" data-help="운영효율은 해당 지표가 수집된 차량, 배터리소비량은 전동 차량, 연료소비량은 엔진 차량만을 대상으로 평균합니다." aria-label="효율 소비 설명" aria-expanded="false">?</button></h2>
              </div>
              <div class="efficiency-list">
                <div class="efficiency-row miq-metric">
                  <span class="efficiency-row__label miq-metric__label">운영효율</span>
                  <strong class="efficiency-row__value summary-value miq-number" id="sumEff">-</strong>
                  <span class="efficiency-row__meta miq-metric__meta" id="sumEffMeta">지표 수집 차량 평균</span>
                </div>
                <div class="efficiency-row miq-metric">
                  <span class="efficiency-row__label miq-metric__label">평균 연료소비량</span>
                  <strong class="efficiency-row__value summary-value miq-number" id="sumFuel">-</strong>
                  <span class="efficiency-row__meta miq-metric__meta" id="sumFuelMeta">엔진 차량 평균</span>
                </div>
                <div class="efficiency-row miq-metric">
                  <span class="efficiency-row__label miq-metric__label">평균 배터리소비량</span>
                  <strong class="efficiency-row__value summary-value miq-number" id="sumBatt">-</strong>
                  <span class="efficiency-row__meta miq-metric__meta" id="sumBattMeta">전동 차량 평균</span>
                </div>
              </div>
            </div>

            <div class="summary-group miq-metric-group">
              <div class="summary-group__head"><h2 class="miq-metric-group__title">이벤트</h2></div>
              <div class="event-metric miq-metric">
                <span class="event-metric__label miq-metric__label">충격 횟수</span>
                <span class="event-metric__value summary-value"><strong class="miq-number" id="sumShock">-</strong><span>회</span></span>
                <span class="event-metric__meta miq-metric__meta">선택 기간 합계</span>
              </div>
            </div>
          </div>
        </div>
        <div class="summary-help-popover" id="summaryHelpText" role="tooltip" hidden></div>
      </section>

      <div class="list-head">
        <span id="summaryScopeSummary" aria-label="현재 조회 범위"></span>
      </div>

      <div class="vlist-wrap miq-panel">
        <table class="vlist miq-data-table" aria-label="차량 운행 요약">
          <colgroup><col/><col/><col/><col/><col/><col/><col/></colgroup>
          <thead>
            <tr id="vlistHead">
              <th scope="col">
                <span class="th-main">차량</span>
                <span class="th-sorts"><button type="button" class="sort-trigger" data-key="model" aria-pressed="false">차대번호<span class="ind"></span></button></span>
              </th>
              <th scope="col">
                <span class="th-main">소속</span>
                <span class="th-sorts">
                  <button type="button" class="sort-trigger" data-key="group" aria-pressed="false">그룹<span class="ind"></span></button>
                  <button type="button" class="sort-trigger" data-key="type" aria-pressed="false">분류<span class="ind"></span></button>
                </span>
              </th>
              <th scope="col">
                <span class="th-main">누적</span>
                <span class="th-sorts">
                  <button type="button" class="sort-trigger" data-key="cumKm" aria-pressed="false">거리<span class="ind"></span></button>
                  <button type="button" class="sort-trigger" data-key="cumH" aria-pressed="false">시간<span class="ind"></span></button>
                </span>
              </th>
              <th scope="col">
                <span class="th-main">선택 기간 <span class="period-flag" data-pflag>월</span></span>
                <span class="th-sorts">
                  <button type="button" class="sort-trigger" data-key="km" aria-pressed="false">거리<span class="ind"></span></button>
                  <button type="button" class="sort-trigger" data-key="min" aria-pressed="false">시간<span class="ind"></span></button>
                </span>
              </th>
              <th scope="col">
                <span class="th-main">효율·소비</span>
                <span class="th-sorts"><button type="button" class="sort-trigger" data-key="eff" aria-pressed="false">값<span class="ind"></span></button></span>
              </th>
              <th class="c" scope="col">
                <span class="th-main">TMS</span>
                <span class="th-sorts"><button type="button" class="sort-trigger" data-key="conn" aria-pressed="false">연결<span class="ind"></span></button></span>
              </th>
              <th class="c" scope="col">
                <span class="th-main">배터리</span>
                <span class="th-sorts"><button type="button" class="sort-trigger" data-key="soc" aria-pressed="false">SOC<span class="ind"></span></button></span>
              </th>
            </tr>
          </thead>
          <tbody id="vlistBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../_shared/fleet.js?v=20260906-json-r1&amp;rev=9bc7caf2ff93"></script>
<script src="../_shared/lnb-tree.js?v=20260905-company-group-r3&amp;rev=11a580f70bf0"></script>
<script>
(function(){
  'use strict';

  var PERIOD={
    d:{label:'일',range:'2026-07-03',f:1/22,eff:1.03},
    w:{label:'주',range:'2026-06-29 ~ 2026-07-05',f:1/4.3,eff:.985},
    m:{label:'월',range:'2026-07-01 ~ 2026-07-31',f:1,eff:1},
    c:{label:'기간',range:'2026-05-01 ~ 2026-07-31',f:3.05,eff:.96}
  };
  var dateRules=window.MIQCommon.dates;
  ['d','w','m','c'].forEach(function(mode){
    var range=dateRules.operatingRange(mode==='c'?'m':mode,dateRules.yesterday());
    PERIOD[mode].range=range.from+' ~ '+range.to;
    if(mode==='c')PERIOD.c.f=dateRules.dayCount(dateRules.parse(range.from),dateRules.parse(range.to))/30
  });
  var VEHICLES=MIQ.FLEET_CATALOG||MIQ.FLEET;
  var QUERY=new URLSearchParams(location.search);
  var currentCompanyId=QUERY.get('companyId')||'all';
  var TYPES=MIQ.TYPES;
  var DETAIL='../Vehicle%20Detail/vehicle-detail-tobe.html';
  var NA="<span class='na'>-</span>";
  var requestedPeriod=({day:'d',week:'w',month:'m',custom:'c'})[QUERY.get('period')]||QUERY.get('period');
  var state={period:PERIOD[requestedPeriod]?requestedPeriod:'m',sortKey:null,sortDir:1,sel:null};
  var initialFrom=dateRules.parse(QUERY.get('from'));
  var initialTo=dateRules.parse(QUERY.get('to'));
  if(initialFrom&&initialTo&&initialFrom<=initialTo&&dateRules.dayCount(initialFrom,initialTo)<=366){
    var from=dateRules.format(initialFrom);
    var to=state.period==='d'?from:dateRules.format(initialTo);
    PERIOD[state.period].range=from+' ~ '+to;
    if(state.period==='c')PERIOD.c.f=dateRules.dayCount(initialFrom,initialTo)/30
  }
  var scopeContext=window.MIQ_TARGET_CONTEXT||null;
  var summaryCard=document.getElementById('summaryCard');

  var tree=MIQ.lnbTree(document.getElementById('lnb'),{
    vehicles:VEHICLES,
    onChange:function(sel){state.sel=sel;render()}
  });
  state.sel=tree.get();

  function num(n,d){return(+n).toFixed(d===undefined?0:d).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
  function hasNumber(value){return value!==null&&value!==undefined&&value!==''&&!isNaN(Number(value))}
  function valueOrDash(value,suffix){return hasNumber(value)?num(value)+(suffix||''):NA}
  function hm(mins){var h=Math.floor(mins/60),m=Math.round(mins%60);return num(h)+'H '+(m<10?'0'+m:m)+'M'}
  function isBatt(v){return v.type==='리튬'||v.type==='납산'}
  function socColor(p){return p>=60?'#00ad83':p>=30?'#ff9d3b':'#ec2d2d'}
  function pv(v){
    var p=PERIOD[state.period];
    var eff=isBatt(v)?Math.min(99.5,v.eff*p.eff):(v.fc?v.fc*(2-p.eff):null);
    var operatingEff=hasNumber(v.efficiencyRate)?Math.min(99.5,Number(v.efficiencyRate)*p.eff):(isBatt(v)?eff:null);
    return{km:v.km*p.f,min:v.min*p.f,eff:eff,operatingEff:operatingEff,shock:Math.round(v.shock*p.f),fc:v.fc?v.fc*(2-p.eff):null,bc:v.bc?v.bc*p.eff:null}
  }
  function effText(v){
    var e=pv(v).eff;
    return e===null?'-':isBatt(v)?e.toFixed(1)+'%':e.toFixed(1)+' ℓ/H'
  }
  function filtered(){
    var rows=state.sel?state.sel.vehicles:VEHICLES;
    if(!currentCompanyId||currentCompanyId==='all')return rows;
    return rows.filter(function(v){return String(v.companyId||'1933')===String(currentCompanyId)})
  }
  function avg(a){return a.reduce(function(s,x){return s+x},0)/a.length}
  function listQueryParams(){
    var params=new URLSearchParams(location.search);
    var range=PERIOD[state.period].range.split(' ~ ');
    params.set('role',document.body.dataset.managementRole||QUERY.get('role')||'internal');
    params.set('companyId',currentCompanyId);
    params.set('period',state.period);
    params.set('from',range[0]);
    params.set('to',range[1]||range[0]);
    return params
  }
  function detailHref(vehicle){
    var listQuery=listQueryParams();
    var params=new URLSearchParams(listQuery.toString());
    params.set('veh',vehicle.vin);
    params.set('companyId',vehicle.companyId||currentCompanyId);
    params.set('group',vehicle.group);
    params.set('type',vehicle.type);
    params.set('returnTo',location.pathname+'?'+listQuery.toString());
    return DETAIL+'?'+params.toString()
  }

  function renderSummary(rows){
    document.getElementById('sumFleet').textContent=rows.length;
    var base=Math.max(rows.length,1);
    document.getElementById('fleetChips').innerHTML=TYPES.map(function(t){
      var n=rows.filter(function(v){return v.type===t}).length;
      return "<span class='fleet-breakdown__item'><span class='fleet-breakdown__name'>"+t+"</span><strong class='fleet-breakdown__count'>"+n+"대</strong><span class='fleet-breakdown__rail'><i class='fleet-breakdown__fill' style='--value:"+(n/base).toFixed(3)+"'></i></span></span>"
    }).join('');

    var km=0,min=0,shock=0,effs=[],fcs=[],bcs=[];
    rows.forEach(function(v){
      var d=pv(v);
      km+=d.km;min+=d.min;shock+=d.shock;
      if(d.operatingEff!==null)effs.push(d.operatingEff);
      if(d.fc!==null)fcs.push(d.fc);
      if(d.bc!==null)bcs.push(d.bc)
    });
    document.getElementById('sumEff').innerHTML=effs.length?avg(effs).toFixed(1)+'%':NA;
    document.getElementById('sumShock').textContent=num(shock);
    document.getElementById('sumKm').textContent=num(km);
    document.getElementById('sumHour').textContent=num(min/60);
    document.getElementById('sumFuel').innerHTML=fcs.length?avg(fcs).toFixed(1)+' ℓ/H':NA;
    document.getElementById('sumBatt').innerHTML=bcs.length?avg(bcs).toFixed(1)+' kWh/H':NA;
    document.getElementById('sumEffMeta').textContent='지표 수집 '+effs.length+'대 평균';
    document.getElementById('sumFuelMeta').textContent='엔진 '+fcs.length+'대 평균';
    document.getElementById('sumBattMeta').textContent='전동 '+bcs.length+'대 평균'
  }

  function sortVal(v,key){
    var d=pv(v);
    switch(key){
      case'model':return v.vin;
      case'group':return v.group;
      case'type':return v.type;
      case'cumKm':return v.cumKm;
      case'cumH':return v.cumH;
      case'km':return d.km;
      case'min':return d.min;
      case'eff':return d.eff;
      case'conn':return v.conn?1:0;
      case'soc':return v.soc===null?-1:v.soc
    }
    return 0
  }
  function applySort(rows){
    if(!state.sortKey)return rows;
    var k=state.sortKey,dir=state.sortDir;
    return rows.slice().sort(function(a,b){
      var x=sortVal(a,k),y=sortVal(b,k);
      if(typeof x==='string')return x.localeCompare(y,'ko')*dir;
      return(x-y)*dir
    })
  }

  function renderRows(rows){
    var body=document.getElementById('vlistBody');
    if(!rows.length){
      body.innerHTML="<tr><td class='c na' colspan='7'>조회 조건에 해당하는 차량이 없습니다.</td></tr>";
      return
    }
    body.innerHTML=rows.map(function(v,index){
      var d=pv(v);
      var soc=v.soc===null?NA:"<span class='batt'><span class='batt__cell'><span class='batt__fill' style='width:"+v.soc+"%;background:"+socColor(v.soc)+"'></span></span><span class='batt__val'>"+v.soc+"%</span></span>";
      var selected=state.sel&&state.sel.vin===v.vin;
      var rowClass=selected?' class="sel"':'';
      return "<tr data-vin='"+v.vin+"' tabindex='0' aria-selected='"+(selected?'true':'false')+"'"+rowClass+" style='--row-delay:"+(index*16)+"ms'>"
        +"<td class='vehicle-cell miq-entity-cell'><a class='v-vin miq-entity-cell__primary' href='"+detailHref(v)+"'>"+v.vin+"</a><span class='v-model miq-entity-cell__secondary'>"+v.model+"</span></td>"
        +"<td><span class='affiliation-cell__group'>"+v.group+"</span><span class='affiliation-cell__type'>"+v.type+"</span></td>"
        +"<td><div class='metric-pair-cell'><span class='metric-pair-cell__line'><span>거리</span><strong>"+valueOrDash(v.cumKm,' Km')+"</strong></span><span class='metric-pair-cell__line'><span>시간</span><strong>"+valueOrDash(v.cumH,' H')+"</strong></span></div></td>"
        +"<td><div class='metric-pair-cell'><span class='metric-pair-cell__line'><span>거리</span><strong>"+num(d.km,d.km<10?1:0)+" Km</strong></span><span class='metric-pair-cell__line'><span>시간</span><strong>"+hm(d.min)+"</strong></span></div></td>"
        +"<td><span class='efficiency-cell__kind'>"+(isBatt(v)?'운영효율':'연료소비')+"</span><strong class='efficiency-cell__value'>"+effText(v)+"</strong></td>"
        +"<td class='c'><span class='conn "+(v.conn?'on':'off')+"'><span class='dot'></span>"+(v.conn===null||v.conn===undefined?'수집 전':v.conn?'연결됨':'연결 끊김')+"</span></td>"
        +"<td class='c'>"+soc+"</td></tr>"
    }).join('');

    Array.prototype.forEach.call(body.querySelectorAll('tr[data-vin]'),function(tr){
      function selectRow(){
        var vin=tr.getAttribute('data-vin');
        tree.set({vin:state.sel.vin===vin?null:vin})
      }
      tr.addEventListener('click',function(e){
        if(e.target.closest('a'))return;
        selectRow()
      });
      tr.addEventListener('keydown',function(e){
        if(e.target.closest('a'))return;
        if(e.key==='Enter'||e.key===' '){e.preventDefault();selectRow()}
      })
    })
  }

  function sharedPeriodReady(){
    var bar=document.getElementById('periodTabs').closest('.filter-bar');
    return bar&&bar.dataset.periodReady==='true'
  }
  function updateDateRange(){
    if(sharedPeriodReady())return;
    var el=document.getElementById('dateRange');
    if(!el)return;
    var range=PERIOD[state.period].range;
    var values=range.split(' ~ ');
    var inputs=el.querySelectorAll('input[type="date"]');
    if(inputs.length){
      inputs[0].value=values[0];
      if(inputs[1])inputs[1].value=values[1]||values[0]
    }else{
      el.textContent=range
    }
  }

  function renderChrome(rows){
    Array.prototype.forEach.call(document.querySelectorAll('.sort-trigger[data-key]'),function(button){
      var on=button.getAttribute('data-key')===state.sortKey;
      var ind=button.querySelector('.ind');
      button.classList.toggle('is-sorted',on);
      button.setAttribute('aria-pressed',on?'true':'false');
      ind.textContent=on?(state.sortDir===1?'▲':'▼'):'↕'
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-pflag]'),function(el){el.textContent=PERIOD[state.period].label});
    updateDateRange();

    var sel=state.sel.vehicle;
    document.getElementById('scopeTitle').textContent='- '+(sel?sel.vin+' · '+sel.model:state.sel.label);

    var scopeHost=document.getElementById('summaryScopeSummary');
    if(scopeHost&&window.MIQ&&typeof MIQ.renderScopeSummary==='function'){
      var target=scopeContext||{};
      var companyId=sel&&sel.companyId?String(sel.companyId):(target.companyId||currentCompanyId||'all');
      var group=state.sel.group||(sel&&sel.group)||target.group||null;
      var type=state.sel.type||(sel&&sel.type)||target.type||null;
      var equipmentId=sel?sel.vin:null;
      var companyName=companyId==='all'?'전체 업체':((sel&&sel.companyName)||target.companyName||'선택 업체');
      MIQ.renderScopeSummary(scopeHost,{
        companyId:companyId,
        group:group,
        type:type,
        equipmentId:equipmentId,
        scopeSegments:[
          {key:'company',label:companyName},
          {key:'group',label:group||'전체 그룹'},
          {key:'type',label:type||'전체 분류'},
          {key:'vehicle',label:sel?sel.vin+' · '+sel.model:'전체 차량'}
        ]
      },{countLabel:'차량',count:rows.length,countUnit:'대',includeVehicle:true})
    }
  }

  function playSummary(){
    summaryCard.classList.add('is-animating');
    summaryCard.classList.remove('is-ready');
    void summaryCard.offsetWidth;
    setTimeout(function(){summaryCard.classList.add('is-ready')},24)
  }
  function render(){
    var rows=applySort(filtered());
    renderSummary(rows);
    renderRows(rows);
    renderChrome(rows);
    playSummary()
  }

  document.getElementById('periodTabs').addEventListener('click',function(e){
    if(sharedPeriodReady())return;
    var button=e.target.closest('button[data-period]');
    if(!button)return;
    Array.prototype.forEach.call(this.querySelectorAll('button'),function(x){x.classList.remove('active')});
    button.classList.add('active');
    state.period=button.getAttribute('data-period');
    render()
  });
  document.addEventListener('miq:period-change',function(event){
    var detail=event.detail||{};
    var mode=detail.period;
    var from=dateRules.parse(detail.startDate);
    var to=dateRules.parse(detail.endDate);
    if(!PERIOD[mode]||!from||!to||from>to)return;
    var days=dateRules.dayCount(from,to);
    if(mode==='c'&&days>366)return;
    state.period=mode;
    PERIOD[mode].range=detail.startDate+' ~ '+detail.endDate;
    if(mode==='c')PERIOD.c.f=days/30;
    render();
    if(history.replaceState)history.replaceState(null,'',location.pathname+'?'+listQueryParams().toString())
  });

  document.getElementById('vlistHead').addEventListener('click',function(e){
    var button=e.target.closest('.sort-trigger[data-key]');
    if(!button)return;
    var key=button.getAttribute('data-key');
    if(state.sortKey===key)state.sortDir=-state.sortDir;
    else{state.sortKey=key;state.sortDir=1}
    render()
  });

  var helpText=document.getElementById('summaryHelpText');
  Array.prototype.forEach.call(document.querySelectorAll('.miq-help[data-help]'),function(button){
    button.addEventListener('click',function(e){
      e.stopPropagation();
      var owner=button.getAttribute('aria-label');
      var willOpen=helpText.hidden||helpText.getAttribute('data-owner')!==owner;
      Array.prototype.forEach.call(document.querySelectorAll('.miq-help[data-help]'),function(x){x.setAttribute('aria-expanded','false')});
      if(willOpen){
        helpText.textContent=button.getAttribute('data-help');
        helpText.setAttribute('data-owner',owner);
        helpText.hidden=false;
        button.setAttribute('aria-expanded','true')
      }else{
        helpText.hidden=true;
        helpText.removeAttribute('data-owner')
      }
    })
  });
  document.addEventListener('click',function(e){
    if(e.target.closest('.summary-help-popover'))return;
    helpText.hidden=true;
    helpText.removeAttribute('data-owner');
    Array.prototype.forEach.call(document.querySelectorAll('.miq-help[data-help]'),function(x){x.setAttribute('aria-expanded','false')})
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    helpText.hidden=true;
    helpText.removeAttribute('data-owner');
    Array.prototype.forEach.call(document.querySelectorAll('.miq-help[data-help]'),function(x){x.setAttribute('aria-expanded','false')})
  });

  document.addEventListener('miq:target-change',function(e){
    scopeContext=e.detail||scopeContext;
    currentCompanyId=e.detail&&e.detail.companyId||currentCompanyId;
    var vin=e.detail&&e.detail.equipmentId;
    var targetGroup=e.detail&&e.detail.group||null;
    var targetType=e.detail&&e.detail.type||null;
    var exists=vin&&VEHICLES.some(function(v){return v.vin===vin});
    if(exists)tree.set({group:null,type:null,vin:vin});
    else if(!vin)tree.set({group:targetGroup,type:targetType,vin:null})
  });

  render()
})();
</script>
</body>
</html>
