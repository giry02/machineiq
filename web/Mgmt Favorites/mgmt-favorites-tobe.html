<style>.xfer{display:grid;grid-template-columns:minmax(0,1fr) 96px minmax(0,1fr);gap:12px;align-items:stretch}
.xfer__col{border:1px solid #e5e7eb;border-radius:8px;background:#fff;display:flex;flex-direction:column}
.xfer__hd{padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.xfer__hd .tail{margin-left:auto;font-weight:400;color:#aaa}
.xfer__list{max-height:290px;overflow:auto}
.xfer__it{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f7f7f7;font-size:12px}
.xfer__it:last-child{border-bottom:none}
.xfer__it:hover{background:#fcfcfd}
.xfer__it .vin{color:#aaa;font-size:11px}
.xfer__it .sp{margin-left:auto}
.xfer__mid{display:flex;flex-direction:column;justify-content:center;gap:8px}

.xfer__it{cursor:pointer}.xfer__it small{display:block;color:#888;margin-top:4px}.favorite-search{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid #eee;flex-wrap:wrap}.favorite-search .inp{min-width:100px;flex:1}.favorite-empty{padding:28px 12px;color:#888;font-size:12px;text-align:center}.favorite-overview{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}#favoriteStatus{min-height:20px;font-size:12px;color:#666;margin-top:12px}.xfer__list{min-height:290px;max-height:400px}@media(max-width:900px){.xfer{grid-template-columns:minmax(0,1fr)}.xfer__mid{flex-direction:row;flex-wrap:wrap}}
