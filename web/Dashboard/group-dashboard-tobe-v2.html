<style>
/* The source markup supplies shared controllers; only the finished preview is painted. */
body:not(.dc-ready) #dashboardContent{visibility:hidden!important}
:root{--bobcat-red:#ff3600;--bobcat-red-hover:#d92e00;--bobcat-red-active:#cc2b00;--bobcat-black:#1e1e1e;--bobcat-dark:#333;--bobcat-muted:#777;--bobcat-gray:#ccc;--bobcat-steel:#d5dee3;--bobcat-light:#f1f1f1;--bobcat-positive:#158737;--bobcat-success:#0aa656;--bobcat-warning:#ff9f0a;--bobcat-danger:#992100;--bobcat-info:#17a2b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;font-size:14px;background:var(--bobcat-light);color:var(--bobcat-dark)}
button,input,select{font:inherit}
button{cursor:pointer}

/* 대시보드는 별도 조회 대상 없이 전체 관제 현황을 제공한다. */
body.miq-content-dashboard[data-gnb="dash"][data-sub="group"]>.miq-target-selector{display:none!important}

.dashboard-main{min-width:0}
.dashboard-content{max-width:none!important;container-name:dashboard-content;container-type:inline-size}
.dashboard-titlebar{display:flex;align-items:center;min-height:40px;margin-bottom:16px;gap:10px}
.dashboard-titlebar .miq-page-title{font-size:24px}
.live-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;background:rgba(255,54,0,.08);color:var(--bobcat-red-active);font-size:11px;font-weight:700;letter-spacing:.02em}
.live-chip::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--bobcat-red);animation:livePulse 1.4s ease-in-out infinite}
.dashboard-updated{color:var(--bobcat-muted);font-size:12px;font-weight:500;line-height:18px;white-space:nowrap}

.dashboard-stack{display:grid;gap:22px}
.dashboard-section{display:grid;gap:12px;min-width:0}
.section-heading{display:flex;align-items:center;gap:12px;min-height:30px}
.section-heading h2{display:flex;align-items:center;gap:8px;color:var(--bobcat-dark);font-size:18px;line-height:26px}
.section-heading h2::before{content:'';width:3px;height:18px;flex:0 0 3px;border-radius:2px;background:var(--bobcat-red)}
.section-heading p{color:var(--bobcat-muted);font-size:12px;line-height:18px}
.section-heading__actions{margin-left:auto}

.dashboard-panel{overflow:hidden;background:#fff;border:1px solid var(--bobcat-steel);border-radius:8px}
.panel-heading{display:flex;align-items:center;min-height:42px;padding:0 18px;border-bottom:1px solid var(--bobcat-steel);background:var(--bobcat-light)}
.panel-heading h3{color:var(--bobcat-dark);font-size:15px;line-height:22px}
.panel-heading p{margin-left:10px;color:var(--bobcat-muted);font-size:12px;line-height:18px}
.panel-heading__meta{margin-left:auto;color:var(--bobcat-muted);font-size:12px;line-height:18px}

/* 실시간 전체 현황 */
.live-summary{display:grid;grid-template-columns:minmax(155px,.68fr) repeat(2,minmax(220px,1fr)) minmax(300px,1.25fr);min-width:0;border-top:2px solid var(--bobcat-red)}
.live-summary>div{min-width:0;padding:16px 20px}
.live-summary>div+div{border-left:1px solid var(--bobcat-steel)}
.fleet-total__label,.status-metric__label,.maintenance__label{display:block;color:var(--bobcat-dark);font-size:13px;font-weight:700;line-height:18px;white-space:nowrap}
.fleet-total__value{display:flex;align-items:baseline;gap:4px;margin-top:5px;color:var(--bobcat-dark)}
.fleet-total__value strong{font-size:32px;line-height:1;font-weight:700;letter-spacing:-.03em}
.fleet-total__value span{font-size:13px;font-weight:600}
.fleet-total__meta{display:block;margin-top:7px;color:var(--bobcat-muted);font-size:12px;line-height:18px}
.status-metric__head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.status-metric__rate{color:var(--bobcat-dark);font-size:22px;font-weight:700;line-height:28px}
.status-metric__track{height:8px;margin:9px 0 8px;overflow:hidden;border-radius:4px;background:var(--bobcat-light)}
.status-metric__track i{display:block;width:calc(var(--value) * 100%);height:100%;border-radius:inherit;background:var(--bobcat-dark);transform:scaleX(1);transform-origin:left center;transition:transform .58s cubic-bezier(.2,.75,.25,1)}
.status-metric__track i.on{background:var(--bobcat-success)}
.status-metric__track i.run{background:var(--bobcat-red)}
.dashboard-content.is-ready .status-metric__track i{transform:scaleX(1)}
.status-metric__details{display:flex;align-items:center;gap:14px;color:var(--bobcat-muted);font-size:12px;line-height:18px}
.status-metric__details span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.status-metric__details b{color:var(--bobcat-dark);font-size:14px}
.status-metric__details .muted b{color:var(--bobcat-muted)}
.maintenance__items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:8px}
.maintenance-item{position:relative;min-width:0;padding:0 10px}
.maintenance-item:first-child{padding-left:0}
.maintenance-item+.maintenance-item{border-left:1px solid var(--bobcat-steel)}
.maintenance-item__value{display:flex;align-items:center;gap:6px;color:var(--bobcat-dark);font-size:22px;font-weight:700;line-height:28px}
.maintenance-item__dot{width:6px;height:6px;border-radius:50%;background:var(--bobcat-danger)}
.maintenance-item.soon .maintenance-item__dot{background:var(--bobcat-warning)}
.maintenance-item__name{display:block;margin-top:2px;color:var(--bobcat-dark);font-size:12px;font-weight:600;line-height:18px;word-break:keep-all;white-space:nowrap}
.maintenance-item__meta{display:block;color:var(--bobcat-muted);font-size:12px;line-height:18px}

/* 그룹 실시간 비교 행렬 */
.group-matrix{width:100%;table-layout:fixed;border-collapse:collapse;font-variant-numeric:tabular-nums}
.group-matrix col:first-child{width:19%}
.group-matrix th,.group-matrix td{height:52px;padding:0 10px;text-align:center;border-bottom:1px solid var(--bobcat-steel)}
.group-matrix thead th{height:36px;color:var(--bobcat-muted);background:var(--bobcat-light);font-size:13px;font-weight:600;line-height:18px;white-space:nowrap}
.group-matrix thead tr:first-child th{height:34px;color:var(--bobcat-dark);border-bottom:1px solid var(--bobcat-steel);background:var(--bobcat-light);font-size:14px;font-weight:700}
.group-matrix thead th+th{border-left:1px solid var(--bobcat-steel)}
.group-matrix tbody tr:last-child th,.group-matrix tbody tr:last-child td{border-bottom:0}
.group-matrix tbody tr:hover{background:var(--bobcat-light)}
.group-matrix tbody th{padding-left:18px;text-align:left}
.group-name{display:block;color:var(--bobcat-dark);font-size:14px;font-weight:700;line-height:20px;white-space:nowrap}
.group-name small{margin-left:5px;color:var(--bobcat-muted);font-size:12px;font-weight:500}
.matrix-number{display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--bobcat-dark);font-size:14px;font-weight:700}
.matrix-signal{width:6px;height:6px;border-radius:50%;background:var(--bobcat-danger)}
.matrix-signal.warning{background:var(--bobcat-warning)}
.matrix-rate{display:flex;align-items:center;justify-content:center;gap:8px}
.matrix-rate b{min-width:34px;color:var(--bobcat-dark);font-size:14px}
.matrix-rate__track{width:52px;height:6px;overflow:hidden;border-radius:3px;background:var(--bobcat-light)}
.matrix-rate__track i{display:block;width:calc(var(--value) * 100%);height:100%;border-radius:inherit;background:var(--bobcat-dark);transform:scaleX(1);transform-origin:left;transition:transform .48s cubic-bezier(.2,.75,.25,1)}
.dashboard-content.is-ready .matrix-rate__track i{transform:scaleX(1)}

/* 기간 필터 */
.period-heading{align-items:center}
.filter-bar{display:flex;align-items:center;gap:6px}
.period-tabs{display:flex;overflow:hidden;border:1px solid var(--bobcat-steel);border-radius:4px;background:#fff}
.period-tabs button{height:40px;padding:0 16px;border:0;border-right:1px solid var(--bobcat-steel);background:#fff;color:var(--bobcat-muted);font-size:13px}
.period-tabs button:last-child{border-right:0}
.period-tabs button:hover{background:var(--bobcat-light);color:var(--bobcat-dark)}
.period-tabs button.active{background:var(--bobcat-black);color:#fff;font-weight:700}
.date-range{display:flex;align-items:center;gap:5px;height:40px;padding:0 12px;border:1px solid var(--bobcat-steel);border-radius:4px;background:#fff;color:var(--bobcat-muted);font-size:13px;white-space:nowrap}
.date-range input{width:130px;height:34px;padding:0 5px;border:0;background:transparent;color:var(--bobcat-dark);font-size:13px;outline:0}
.dashboard-period .btn-search{height:40px!important;min-height:40px!important;padding:0 18px!important;border:1px solid var(--bobcat-red-hover)!important;border-radius:4px;background:var(--bobcat-red-hover)!important;color:#fff;font-size:14px;font-weight:700}
.dashboard-period .btn-search:hover{border-color:var(--bobcat-red-active)!important;background:var(--bobcat-red-active)!important}
.dashboard-period .btn-search:active{border-color:#bf2900!important;background:#bf2900!important}
.period-tabs button:focus-visible,.dashboard-period .btn-search:focus-visible{outline:2px solid var(--bobcat-red);outline-offset:2px}

/* 전체 기간 비교 */
.usage-compare-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.compare-metric{min-width:0;padding:16px 18px}
.compare-metric+.compare-metric{border-left:1px solid var(--bobcat-steel)}
.compare-metric__head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.compare-metric__label{color:var(--bobcat-dark);font-size:13px;font-weight:700;line-height:18px;white-space:nowrap}
.compare-metric__delta{padding:2px 7px;border-radius:10px;background:var(--bobcat-light);color:var(--bobcat-muted);font-size:12px;font-style:normal;font-weight:700;line-height:18px;white-space:nowrap}
.compare-metric__delta.is-improved,.efficiency-item__delta.is-improved,.pair-value em.is-improved,.eff-delta.is-improved{color:var(--bobcat-positive);background:rgba(21,135,55,.09)}
.compare-metric__delta.is-worsened,.efficiency-item__delta.is-worsened,.pair-value em.is-worsened,.eff-delta.is-worsened{color:var(--bobcat-danger);background:rgba(153,33,0,.08)}
.compare-metric__delta.is-flat,.efficiency-item__delta.is-flat,.pair-value em.is-flat,.eff-delta.is-flat{color:var(--bobcat-muted);background:var(--bobcat-light)}
.compare-metric__current{margin:6px 0 10px;color:var(--bobcat-dark);font-size:26px;font-weight:700;line-height:32px;letter-spacing:-.02em;white-space:nowrap}
.compare-metric__current small{margin-left:4px;color:var(--bobcat-muted);font-size:12px;font-weight:500}
.compare-track{display:grid;grid-template-columns:36px minmax(40px,1fr) 50px;align-items:center;gap:7px;height:22px;color:var(--bobcat-muted);font-size:12px}
.compare-track b{text-align:right;color:var(--bobcat-muted);font-size:12px;font-weight:600}
.compare-track__rail{height:6px;overflow:hidden;border-radius:3px;background:var(--bobcat-light)}
.compare-track__rail i{display:block;width:calc(var(--value) * 100%);height:100%;border-radius:inherit;background:var(--bobcat-gray);transform:scaleX(1);transform-origin:left;transition:transform .5s cubic-bezier(.2,.75,.25,1)}
.compare-track.cur .compare-track__rail i{background:var(--bobcat-red)}
.compare-track.cur b{color:var(--bobcat-dark)}
.dashboard-content.is-ready .compare-track__rail i{transform:scaleX(1)}

.efficiency-band{display:grid;grid-template-columns:140px repeat(5,minmax(0,1fr));border-top:1px solid var(--bobcat-steel)}
.efficiency-title{display:flex;flex-direction:column;justify-content:center;padding:13px 18px}
.efficiency-title strong{color:var(--bobcat-dark);font-size:14px;line-height:20px}
.efficiency-title span{margin-top:2px;color:var(--bobcat-muted);font-size:12px;line-height:18px}
.efficiency-item{min-width:0;padding:12px 14px;border-left:1px solid var(--bobcat-steel)}
.efficiency-item__label{display:block;overflow:hidden;color:var(--bobcat-dark);font-size:12px;font-weight:600;line-height:18px;text-overflow:ellipsis;white-space:nowrap}
.efficiency-item__pair{display:flex;align-items:baseline;gap:4px;margin-top:4px;color:var(--bobcat-muted);font-size:12px;line-height:18px;white-space:nowrap}
.efficiency-item__pair strong{color:var(--bobcat-red-active);font-size:16px}
.efficiency-item__pair i{color:var(--bobcat-gray);font-style:normal}
.efficiency-item__delta{display:inline-flex;margin-top:2px;padding:1px 6px;border-radius:10px;color:var(--bobcat-muted);font-size:12px;font-style:normal;font-weight:600;line-height:18px}

/* 그룹별 기간 성과 */
.performance-subsection+.performance-subsection{border-top:1px solid var(--bobcat-steel)}
.performance-subhead{display:flex;align-items:center;min-height:40px;padding:0 18px;border-bottom:1px solid var(--bobcat-steel);background:var(--bobcat-light)}
.performance-subhead h4{color:var(--bobcat-dark);font-size:14px;line-height:20px}
.performance-subhead span{margin-left:9px;color:var(--bobcat-muted);font-size:12px;line-height:18px}
.performance-table{width:100%;table-layout:fixed;border-collapse:collapse;font-variant-numeric:tabular-nums}
.performance-table col:first-child{width:19%}
.performance-table th,.performance-table td{height:64px;padding:8px 14px;border-bottom:1px solid var(--bobcat-steel);text-align:left}
.performance-table thead th{height:40px;padding-top:0;padding-bottom:0;background:var(--bobcat-light);color:var(--bobcat-muted);font-size:13px;font-weight:600;line-height:18px;white-space:nowrap}
.performance-table thead th:not(:first-child),.performance-table tbody td{border-left:1px solid var(--bobcat-steel)}
.performance-table tbody tr:last-child th,.performance-table tbody tr:last-child td{border-bottom:0}
.performance-table tbody tr:hover{background:var(--bobcat-light)}
.performance-table tbody th{padding-left:18px}
.performance-table .group-name small{display:block;margin:2px 0 0}
.pair-value{display:flex;align-items:baseline;gap:5px;color:var(--bobcat-muted);font-size:12px;line-height:18px;white-space:nowrap}
.pair-value strong{color:var(--bobcat-dark);font-size:14px}
.pair-value i{color:var(--bobcat-gray);font-style:normal}
.pair-value small{color:var(--bobcat-muted);font-size:12px}
.pair-value em{margin-left:auto;padding:1px 6px;border-radius:10px;background:var(--bobcat-light);color:var(--bobcat-muted);font-size:12px;font-style:normal;font-weight:700;line-height:18px}
.micro-compare{display:grid;gap:3px;margin-top:6px}
.micro-compare span{height:4px;overflow:hidden;border-radius:2px;background:var(--bobcat-light)}
.micro-compare i{display:block;width:calc(var(--value) * 100%);height:100%;border-radius:inherit;background:var(--bobcat-gray);transform:scaleX(1);transform-origin:left;transition:transform .5s cubic-bezier(.2,.75,.25,1)}
.micro-compare .cur i{background:var(--bobcat-red)}
.dashboard-content.is-ready .micro-compare i{transform:scaleX(1)}
.eff-pair{display:flex;align-items:baseline;gap:5px;color:var(--bobcat-muted);font-size:12px;line-height:18px;white-space:nowrap}
.eff-pair strong{color:var(--bobcat-dark);font-size:14px}
.eff-pair i{color:var(--bobcat-gray);font-style:normal}
.eff-pair small{color:var(--bobcat-muted);font-size:12px}
.eff-delta{display:inline-flex;margin-top:4px;padding:1px 6px;border-radius:10px;color:var(--bobcat-muted);font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}

.dashboard-content.is-animating:not(.is-ready) .status-metric__track i,
.dashboard-content.is-animating:not(.is-ready) .matrix-rate__track i,
.dashboard-content.is-animating:not(.is-ready) .compare-track__rail i,
.dashboard-content.is-animating:not(.is-ready) .micro-compare i{transform:scaleX(0)}
.motion-row{opacity:1;transform:none}
.dashboard-content.is-animating:not(.is-ready) .motion-row{opacity:.72;transform:translateY(3px)}
.dashboard-content.is-ready .motion-row{opacity:1;transform:none;transition:opacity .22s ease var(--delay,0s),transform .22s ease var(--delay,0s)}

@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.35}}

@container dashboard-content (max-width:1100px){
  .live-summary{grid-template-columns:140px repeat(2,minmax(0,1fr))}
  .live-summary .maintenance{display:grid;grid-column:1/-1;grid-template-columns:140px minmax(0,1fr);align-items:center;border-top:1px solid var(--bobcat-steel);border-left:0}
  .live-summary .maintenance__items{margin-top:0}
  .usage-compare-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .compare-metric:nth-child(3){border-top:1px solid var(--bobcat-steel);border-left:0}
  .compare-metric:nth-child(4){border-top:1px solid var(--bobcat-steel)}
  .efficiency-band{grid-template-columns:120px repeat(5,minmax(0,1fr))}
  .efficiency-item{padding-inline:10px}
  .group-matrix col:first-child,.performance-table col:first-child{width:17%}
  .group-matrix th,.group-matrix td{padding-inline:6px}
  .performance-table th,.performance-table td{padding-inline:9px}
}

@container dashboard-content (max-width:820px){
  .dashboard-titlebar{flex-wrap:wrap}
  .section-heading{align-items:flex-start;flex-direction:column}
  .section-heading__actions{width:100%;margin-left:0}
  .filter-bar{flex-wrap:wrap}
  .live-summary{grid-template-columns:1fr}
  .live-summary>div+div{border-top:1px solid var(--bobcat-steel);border-left:0}
  .live-summary .maintenance{grid-column:auto}
  .usage-compare-grid{grid-template-columns:1fr}
  .compare-metric+.compare-metric{border-top:1px solid var(--bobcat-steel);border-left:0}
  .efficiency-band{grid-template-columns:repeat(2,minmax(0,1fr))}
  .efficiency-title{grid-column:1/-1;border-bottom:1px solid var(--bobcat-steel)}
  .efficiency-item:nth-child(even){border-left:0}
  .dashboard-panel--scroll{overflow-x:auto}
  .group-matrix,.performance-table{min-width:860px}
}

@media (prefers-reduced-motion:reduce){
  .live-chip::before{animation:none}
  .motion-row{opacity:1;transform:none}
}
.live-chip[hidden],.dashboard-updated[hidden]{display:none}
</style>

<body data-current-bootstrap="ready" data-screen-id="LQ-DASH-001" data-period-presets="dwm" class="miq-current-shell miq-content-system miq-content-dashboard miq-dashboard-widgets-preview" data-gnb="dash" data-sub="group" data-variant="tobe" data-base="../">

<div id="gnb"></div>

<div class="layout">
  <main class="main dashboard-main">
